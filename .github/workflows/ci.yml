name: CI
on:
  push: { branches: [main] }
  pull_request:

jobs:
  fastapi:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: serverless-fastapi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: serverless-fastapi/requirements.txt
      - run: pip install -r requirements.txt
      - name: Start server
        run: |
          uvicorn api.index:app --port 8000 --workers 1 &
          sleep 3
      - name: Concurrency test
        run: python test_concurrency.py -n 10 -d 1

  webhook:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: supabase-telegram-webhook
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm test
